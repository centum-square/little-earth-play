<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>리틀어스 (그레이박스)</title>
<style>
  :root { color-scheme: dark; --bg:#1b2a1e; --panel:#243a2a; --panel2:#2f4a36; --ink:#e9f0e4; --muted:#9db39a; --accent:#f2b134; --good:#6fcf97; --bad:#ef7b7b; --line:#3a543f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; }
  #app { height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 8px) 14px 8px; min-height:56px; }
  header h1 { font-size:16px; font-weight:600; }
  header .right { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
  header .right b { color:var(--ink); }
  header button { background:none; border:0; font-size:20px; padding:4px 6px; }
  #stage { flex:1; position:relative; min-height:0; }
  #stage canvas { position:absolute; inset:0; margin:auto; }
  .scr { position:absolute; inset:0; padding:12px 16px; overflow:auto; display:none; background:var(--bg); }
  .scr.on { display:block; }
  .scr.canvas { background:transparent; pointer-events:none; }
  .scr.canvas > * { pointer-events:auto; }
  .scr h2 { font-size:17px; margin:4px 0 12px; }
  .scr h2 small { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px; }
  .card { background:var(--panel); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:center; border:1px solid transparent; }
  .card.tap { cursor:pointer; } .card.tap:active { border-color:var(--accent); }
  .card.dim { opacity:.45; }
  .card .em { font-size:28px; width:40px; text-align:center; }
  .card .sil { font-size:28px; width:40px; text-align:center; filter:brightness(0) opacity(.5); }
  .card .body { flex:1; min-width:0; }
  .card .name { font-weight:600; }
  .card .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .card .tail { color:var(--muted); font-size:12px; }
  .btn { display:block; width:100%; padding:13px; border-radius:10px; border:0; font-weight:600; font-size:15px; background:var(--accent); color:#1b2a1e; margin-top:10px; }
  .btn.sec { background:var(--panel2); color:var(--ink); }
  .btn:disabled { opacity:.4; }
  .row { display:flex; gap:8px; }
  .row .btn { margin-top:10px; }
  .muted { color:var(--muted); font-size:12px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  .chip { background:var(--panel2); border-radius:999px; padding:4px 10px; font-size:12px; border:1px solid transparent; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .dexcard { background:var(--panel); border-radius:10px; padding:10px 6px; text-align:center; font-size:11px; }
  .dexcard .em { font-size:26px; } .dexcard .em.sil { filter:brightness(0) opacity(.45); }
  .dexcard .st { color:var(--accent); font-size:10px; }
  .dexcard.flash { animation: flash .5s 3; } @keyframes flash { 50% { box-shadow:0 0 0 3px var(--accent); } }
  .fam { margin:14px 0 6px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .fam .rib { color:var(--good); }
  nav { display:flex; border-top:1px solid var(--line); background:var(--panel); padding-bottom:env(safe-area-inset-bottom); }
  nav.hide { display:none; }
  nav button { flex:1; background:none; border:0; color:var(--muted); padding:10px 0 8px; font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button .ic { font-size:20px; } nav button.on { color:var(--accent); }
  /* 인트로 */
  #s0 { padding:0; display:none; flex-direction:column; } #s0.on { display:flex; }
  #s0 .cut { flex:1; display:flex; align-items:flex-end; padding:24px 20px 40px; font-size:17px; line-height:1.6; }
  #s0 .top { position:absolute; top:10px; right:12px; display:flex; gap:8px; align-items:center; }
  #s0 .dots { position:absolute; top:16px; left:16px; color:var(--muted); font-size:12px; }
  #s0 .skip { background:rgba(0,0,0,.35); border:0; border-radius:999px; padding:6px 12px; font-size:12px; color:#fff; }
  /* 오버레이 */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:24px; z-index:20; }
  .ov.show { display:flex; }
  .sheet { background:var(--panel); border-radius:14px; padding:20px 18px; width:100%; max-width:340px; }
  .letter { background:#f7f6f2; color:#1f1d1a; border-radius:10px; padding:16px 18px 20px; width:100%; max-width:340px; line-height:1.8; font-size:14.5px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .letter .hdr { border-bottom:1px solid #d9d4c8; padding-bottom:10px; margin-bottom:12px; font-size:12.5px; color:#3a3733; } .letter .hdr .k { display:inline-block; width:62px; color:#8a857a; } .letter .hdr div:last-child { font-weight:600; color:#1f1d1a; }
  .letter .sign { text-align:right; margin-top:18px; } .letter .gap { height:10px; } .letter .ps { color:#6b5f48; font-size:12px; margin-top:12px; border-top:1px dashed #cdbfa0; padding-top:8px; }
  .letter .tapc { text-align:center; color:#8a7d64; font-size:11px; margin-top:14px; }
  .bubble { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 80px); background:#fff; color:#1b2a1e; border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.5; z-index:25; display:none; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .blocker { position:fixed; inset:0; z-index:23; display:none; } .blocker.show { display:block; }
  .letter .hdr .addr { color:#8a857a; font-size:11px; margin-left:4px; }
  .bubble.show { display:block; } .nextBtn { display:block; margin:10px 0 0 auto; padding:8px 18px; border:0; border-radius:8px; background:#2b2a27; color:#fff; font-size:13px; font-weight:600; } .nextBtn.wide { margin:14px 0 0; width:100%; padding:11px; }
  .scr .ctl { position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 20px); display:flex; gap:8px; } .scr .ctl .btn { margin:0; } .scr .ctl .btn.sec { flex:0 0 auto; width:auto; padding:13px 16px; }
  #s0 .cut { padding-bottom:110px; }
  #s0 .cut.mid { align-items:center; justify-content:center; text-align:center; padding-bottom:0; } #s0 .cut.mid .emoji { top:28%; } .bubble small { display:block; color:#777; font-size:11px; margin-top:6px; } .bubble .who { display:block; font-size:11px; color:#8a6d2b; margin-bottom:4px; } .bubble.grandpa { background:#f3ecd8; }
  #s0 .cut .emoji { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-size:72px; opacity:.9; }
  #s0 .letterIn { position:absolute; left:20px; right:20px; bottom:120px; background:#f7f6f2; color:#1f1d1a; border-radius:10px; padding:16px; font-size:14px; } #s0 .letterIn .lbl { color:#8a857a; font-size:12px; } #s0 .letterIn .row { display:flex; gap:8px; align-items:baseline; font-size:13px; margin-bottom:4px; } #s0 .letterIn .row .k { color:#8a857a; width:62px; flex-shrink:0; } #s0 .letterIn input { width:100%; margin-top:6px; padding:10px; font-size:16px; border:0; border-bottom:2px solid #3a3733; background:transparent; color:#1f1d1a; outline:none; } #s0 .letterIn .avatars button { background:#e6e3dc; } #s0 .letterIn .btn { background:#2b2a27; color:#fff; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 80px); background:rgba(0,0,0,.75); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; z-index:24; display:none; max-width:90%; }
  .toast.show { display:block; }
  .res { text-align:center; } .res .em { font-size:40px; } .res h2 { font-size:18px; margin:8px 0 2px; } .res p { color:var(--muted); font-size:12px; }
  .res table { width:100%; margin:12px 0; font-size:13px; border-collapse:collapse; } .res td { padding:4px 0; text-align:left; } .res td.num { text-align:right; color:var(--muted); }
  .xp { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin:4px 0 2px; } .xp i { display:block; height:100%; background:var(--accent); }
  input.nick { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:16px; margin:8px 0; }
  .avatars { display:flex; gap:8px; justify-content:space-between; margin:8px 0 4px; }
  .avatars button { font-size:26px; background:var(--panel2); border:2px solid transparent; border-radius:12px; width:46px; height:46px; }
  .avatars button.on { border-color:var(--accent); }
  .trail { background:var(--panel); border-radius:12px; padding:16px 12px; text-align:center; cursor:pointer; border:1px solid transparent; }
  .trail:active { border-color:var(--accent); } .trail .ic { font-size:34px; } .trail .nm { font-weight:600; margin-top:6px; font-size:13px; } .trail .ht { color:var(--muted); font-size:11px; margin-top:4px; line-height:1.4; } .trail .bait { color:var(--accent); font-size:11px; margin-top:4px; }
  .meet { text-align:center; padding-top:30px; padding-bottom:100px; } .meet .em { font-size:72px; transition:filter .4s; } .meet .em.sil { filter:brightness(0) opacity(.5); } .meet h3 { font-size:20px; margin-top:8px; } .meet .tags { margin:14px 0; display:flex; flex-direction:column; gap:6px; font-size:14px; }
  .dome { position:relative; height:260px; background:radial-gradient(ellipse at 50% 100%, #35533c, #243a2a 70%); border-radius:120px 120px 12px 12px; margin:8px 0 12px; overflow:hidden; border:1px solid var(--line); }
  .dome.off { filter:grayscale(1) brightness(.5); }
  .door { display:flex; gap:8px; } .door .card { flex:1; }
  .err { color:var(--bad); font-size:12px; min-height:16px; }
</style>
  <script type="module" crossorigin src="./assets/index-DKkKixuY.js"></script>
</head>
<body>
<div id="app">
  <header><h1 id="title">탐험</h1><div class="right" id="status"></div></header>
  <div id="stage">
    <div class="scr" id="s0"></div>
    <div class="scr" id="s0p"></div>
    <div class="scr" id="s1"></div>
    <div class="scr" id="s2"></div>
    <div class="scr" id="s3"></div>
    <div class="scr" id="s4"></div>
    <div class="scr canvas" id="s5"></div>
    <div class="scr" id="s6"></div>
    <div class="scr" id="s7"></div>
    <div class="scr" id="s8"></div>
    <div class="scr" id="s10"></div>
  </div>
  <nav id="nav">
    <button data-tab="s1"><span class="ic">🧭</span>탐험</button>
    <button data-tab="s8"><span class="ic">🌍</span>리틀어스</button>
    <button data-tab="s7"><span class="ic">📖</span>도감</button>
  </nav>
</div>
<div class="ov" id="letterOv"><div class="letter" id="letterBox"></div></div>
<div class="ov" id="sheetOv"><div class="sheet" id="sheetBox"></div></div>
<div class="blocker" id="blocker"></div>
<div class="bubble" id="bubble"></div>
<div class="toast" id="toast"></div>
</body>
</html>
