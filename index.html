<html lang="ko">
<head>

<title>리틀어스</title>
<style>
  @font-face { font-family:"Galmuri11"; src:url("fonts/Galmuri11.woff2") format("woff2"); font-weight:400; font-display:swap; }

  /* 디자인 시스템 "또렷한 픽셀"(2026-10-14): paper 바탕 · ink 선 하나 · 각진 모양 · 단단한 그림자 · 갈무리 글꼴 */
  :root { color-scheme: light; --bg:#fff8e7; --panel:#ffffff; --panel2:#ffe7b8; --ink:#1b1b1b; --muted:#6b5a45; --accent:#ff7a2f; --good:#3fae5a; --bad:#e8402a; --line:#1b1b1b; --coin:#f2b134; --grass:#4cc35a; --sh:3px 3px 0 #1b1b1b; --sh-p:1px 1px 0 #1b1b1b; --px11:"Galmuri11","Apple SD Gothic Neo",sans-serif; --px14:"Galmuri14","Apple SD Gothic Neo",sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--ink); font-family:var(--px14); overflow:hidden; }
  button { font:inherit; color:inherit; }
  #app { height:100dvh; display:flex; flex-direction:column; }

  header .left { display:flex; align-items:center; gap:2px; min-width:0; } #back { width:44px; height:44px; margin-left:-10px; color:var(--ink); font-size:22px; padding:0; }

  .sw { position:relative; width:44px; height:26px; border-radius:13px; border:0; padding:0; background:var(--panel2); flex:0 0 auto; transition:background .15s; } .sw i { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; } .sw.on { background:var(--accent); } .sw.on i { left:21px; }

  .letter .sign { margin-top:18px; } .letter .gap { height:10px; } .letter .ps { color:#6b5f48; font-size:12px; margin-top:12px; border-top:1px dashed #cdbfa0; padding-top:8px; } .letter .ps div + div { margin-top:6px; }
  .letter .tapc { text-align:center; color:#8a7d64; font-size:11px; margin-top:14px; }
  .bubble { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 80px); background:#fff; color:#1b2a1e; border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.5; word-break:keep-all; z-index:25; display:none; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .blocker { position:fixed; inset:0; z-index:23; display:none; } .blocker.show { display:block; }
  .letter .hdr .addr { color:#8a857a; font-size:11px; margin-left:4px; }
  .bubble.show { display:block; } .nextBtn { display:block; margin:10px 0 0 auto; padding:8px 18px; border:0; border-radius:8px; background:#2b2a27; color:#fff; font-size:13px; font-weight:600; } .nextBtn.wide { margin:14px 0 0; width:100%; padding:11px; }
  .scr .ctl { position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 20px); display:flex; gap:8px; } .scr .ctl .btn { margin:0; } .scr .ctl .btn.sec { flex:0 0 auto; width:auto; padding:13px 16px; }
  #s0 .cut { padding-bottom:110px; }
  #s0 .cut.mid { align-items:center; justify-content:center; text-align:center; padding-bottom:0; } #s0 .cut.mid .emoji { top:28%; } .bubble small { display:block; color:#777; font-size:11px; margin-top:6px; } .bubble .who { display:block; font-size:11px; color:#8a6d2b; margin-bottom:4px; } .bubble.grandpa { background:#f3ecd8; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 80px); background:rgba(0,0,0,.75); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; z-index:24; display:none; max-width:90%; }
  .toast.show { display:block; }

  .res table { width:100%; margin:12px 0; font-size:13px; border-collapse:collapse; } .res td { padding:4px 0; text-align:left; } .res td.num { text-align:right; color:var(--muted); }

  #s3 .walk .clue { font-size:15px; text-align:center; max-width:300px; line-height:1.55; word-break:keep-all; color:var(--ink); } /* 단서가 선명해짐(P4-B2) */
  .partner { white-space:nowrap; gap:10px; min-height:44px; } .partner span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .dexcard.gold { box-shadow:inset 0 0 0 2px #d9b44a; } #sheetBox .guide.gold { box-shadow:0 0 0 2px #d9b44a; } #sheetBox .guide .memo { margin-top:8px; font-size:12px; color:#8a6d2b; } /* 하트 효과(P8) */
  .donate { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; z-index:4; padding:10px 18px; border-radius:22px; border:0; background:var(--accent); color:#1b2a1e; font-weight:600; font-size:14px; pointer-events:auto; }

  .view { display:flex; flex-wrap:wrap; gap:4px; font-size:26px; margin:8px 0 12px; justify-content:center; }

  #s3 .trail.flip-out { animation:flipOut .26s ease-in forwards; } #s3 .trail.flip-in { animation:flipIn .3s ease-out; }

  @media (prefers-reduced-motion: reduce) { #s3 .trail.flip-out, #s3 .trail.flip-in { animation:none; } }
  .seg { display:flex; gap:6px; margin:4px 0 8px; } .seg button { flex:1; padding:7px 4px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:1px; } .seg button small { font-size:11px; color:var(--muted); } .seg button.on { border-color:var(--accent); color:var(--accent); } /* 상점 간식 등급 탭 */
  .nblk { display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:12px 8px; margin:12px 0 8px; } .nblk span { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; text-align:center; word-break:keep-all; } .nblk .mbox { height:46px; display:flex; align-items:center; justify-content:center; } .mini { display:inline-grid; gap:2px; } .mini b { width:10px; height:10px; border-radius:2px; background:transparent; } .mini b.on { background:var(--accent); } /* 새 블록: 같은 너비 칸에 모양(가운데)+이름, 빈자리는 안 그림(2026-10-11) */

  .metb { background:none; border:0; padding:0 2px; font-size:20px; cursor:pointer; } .res .cluep { font-size:14px; line-height:1.6; color:var(--ink); word-break:keep-all; margin-top:4px; }

  /* 탭 화면(탐험·리틀어스·도감) 공통: 헤더 없음, 맨 위 떠 있는 줄 = 왼쪽 코인·랭크 알약 / 오른쪽 📧·⚙︎ (44×44, 가장자리 12, 간격 12) */
