<style>
  /* 디자인 시스템 B "페인팅 톤"(2026-10-17, 아트 준비 1-4 결정. 전에는 "또렷한 픽셀" 10-14): 종이 바탕 · 갈색 선 · 살짝 둥근 모서리(요소 6 · 카드 8 · 시트 12, 알약·원 모양 없음) · 부드러운 아래 그림자 · 기기 기본 한글 글꼴(10-17 의견으로 Jua·고운돋움 대신). 변수 이름(--px11·--px14)은 코드 호환을 위해 그대로 */
  :root { color-scheme: light; --slot-tint:transparent; --bg:#f7ecd4; --panel:#fffaf0; --panel2:#f3dfb4; --ink:#3b2a1e; --muted:#8a6a4a; --accent:#e8763a; --good:#4f9a4a; --bad:#d9483b; --line:#7a5233; --coin:#e8a935; --grass:#5aa64a; --sh:0 3px 0 rgba(91,58,34,.4); --sh-p:0 1px 0 rgba(91,58,34,.4); --r-el:6px; --r-card:8px; --r-sheet:12px; --px11:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif; --px14:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
